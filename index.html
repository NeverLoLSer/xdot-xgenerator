<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dot Variant Generator</title>
  <style>
    :root {
      --bg: #050505;
      --sidebar-bg: #0a0a0a;
      --fg: #e0e0e0;
      --border: #333;
      --accent: #eeeeee;
      --font: 'IBM Plex Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--fg); font-family: var(--font); display: flex; min-height: 100vh; overflow-x: hidden; }
    
    /* Left Sidebar */
    .sidebar { width: 60px; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 20px 0; z-index: 10; }
    .side-icon { display: flex; flex-direction: column; align-items: center; color: #888; font-size: 10px; cursor: pointer; text-decoration: none; border: none; background: transparent; transition: color 0.2s; }
    .side-icon svg { width: 20px; height: 20px; margin-bottom: 4px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .side-icon:hover { color: var(--fg); }

    /* Main Area */
    .main-content { flex: 1; display: flex; flex-direction: column; position: relative; }
    
    .center-stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 800px; margin: 0 auto; }
    
    /* Mascot */
    .mascot { margin-bottom: 30px; }
    .mascot svg { width: 100px; height: 100px; stroke: var(--fg); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    
    /* Input Row */
    .input-bar { display: flex; align-items: center; border: 1px solid var(--fg); border-radius: 13px; padding: 6px 14px; width: 100%; max-width: 600px; background: transparent; }
    .input-bar svg { width: 16px; height: 16px; stroke: #888; fill: none; margin-right: 10px; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.5; }
    .input-bar input { flex: 1; background: transparent; border: none; color: var(--fg); font-family: var(--font); font-size: 14px; outline: none; }
    .input-bar input::placeholder { color: #555; }
    .domain-select { background: transparent; color: #aaa; border: none; font-family: var(--font); font-size: 14px; outline: none; margin: 0 10px; cursor: pointer; }
    .domain-select option { background: var(--bg); color: var(--fg); }
    
    /* Pills below input */
    .pills-row { display: flex; gap: 10px; margin-top: 15px; }
    .pill { display: flex; align-items: center; gap: 6px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; padding: 6px 13px; font-family: var(--font); font-size: 13px; color: #aaa; cursor: pointer; transition: all 0.2s; }
    .pill:hover { background: #2a2a2a; color: var(--fg); }
    .pill.generate-btn { background: #e8e8e8; color: #000; border-color: #e8e8e8; font-weight: bold; }
    .pill.generate-btn:hover { background: #fff; }
    .pill svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }

    /* Output Display */
    .output-area { margin-top: 40px; text-align: center; height: 60px; }
    .generated-email { font-size: 24px; font-weight: bold; letter-spacing: 1px; color: var(--accent); user-select: all; }
    .status-msg { margin-top: 8px; font-size: 13px; color: #888; height: 15px; }

    /* Footer */
    .footer { text-align: center; padding: 20px; font-size: 10px; color: #444; }
    
    /* Modals & Panels */
    .overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: none; z-index: 99; justify-content: center; align-items: center; }
    .panel { position: relative; background: var(--sidebar-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; width: 400px; max-width: 90%; max-height: 80vh; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
    .panel h3 { font-size: 14px; margin-bottom: 5px; color: #fff; border-bottom: 1px solid #333; padding-bottom: 10px; padding-right: 24px; }
    .panel-close { position: absolute; top: 15px; right: 15px; background: transparent; color: #888; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 2px; transition: color 0.2s; }
    .panel-close:hover { color: #fff; }
    .panel-close svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* Domain List & Forms */
    .item-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .item-list li { display: flex; justify-content: space-between; align-items: center; background: #111; padding: 8px 13px; border-radius: 6px; font-size: 13px; border: 1px solid #222; }
    .item-actions button { background: transparent; border: 1px solid #444; color: #aaa; border-radius: 4px; padding: 3px 8px; cursor: pointer; font-size: 11px; margin-left: 5px; transition: background 0.2s; }
    .item-actions button:hover { background: #222; color: #fff; }
    .item-actions .btn-del:hover { background: #551111; color: #ff5555; border-color: #772222; }
    .add-form { display: flex; gap: 10px; margin-top: 10px; }
    .add-form input { flex: 1; background: #000; border: 1px solid #333; color: #fff; padding: 8px; border-radius: 6px; font-family: var(--font); }
    .add-form button { background: #222; color: #fff; border: 1px solid #444; border-radius: 6px; padding: 8px 13px; cursor: pointer; transition: background 0.2s; }
    .add-form button:hover { background: #333; }

    /* Global Reset Section */
    .danger-zone { margin-top: 10px; border-top: 1px dashed #333; padding-top: 20px; }
    .btn-danger { background: rgba(255, 85, 85, 0.05); color: #ff5555; border: 1px solid rgba(255, 85, 85, 0.2); border-radius: 6px; padding: 10px; cursor: pointer; font-family: var(--font); font-size: 13px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s; }
    .btn-danger:hover { background: #ff5555; color: #fff; border-color: #ff5555; }
    .btn-danger svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
  </style>
</head>
<body>

  <!-- LEFT SIDEBAR -->
  <aside class="sidebar">
    <button class="side-icon" onclick="openModal('history-modal')" title="History">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
      history
    </button>
    <button class="side-icon" onclick="openModal('domain-modal')" title="Settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      settings
    </button>
    <div class="side-icon" onclick="alert('Dot Variant Generator.\nData is strictly stored in your browser\'s LocalStorage. Fully serverless!')" title="About">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
      about
    </div>
  </aside>

  <!-- MAIN AREA -->
  <main class="main-content">
    <div class="center-stage">
      
      <!-- Mascot -->
      <div class="mascot">
        <svg viewBox="0 0 24 24">
          <path d="M12 5c.67 0 1.35.09 2 .26 1.78-2 5.03-2.84 6.42-2.26 1.4.58-.42 7 .58 10a10.68 10.68 0 0 1-9 10 10.67 10.67 0 0 1-9-10c1-3-.82-9.42.58-10 1.39-.58 4.64.26 6.42 2.26.65-.17 1.33-.26 2-.26z"></path>
          <path d="M9 14h.01M15 14h.01M10 18s1.5 2 4 0"></path>
        </svg>
      </div>

      <!-- Main Input Bar -->
      <div class="input-bar">
        <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
        <input type="text" id="local-part" placeholder="local part (without @)" onkeypress="handleEnter(event)">
        <select id="domain-select" class="domain-select"></select>
      </div>

      <!-- Action Pills -->
      <div class="pills-row">
        <button class="pill generate-btn" onclick="generate()">
          <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg> generate
        </button>
        <button class="pill" onclick="copyResult()">
          <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> copy
        </button>
      </div>

      <!-- Result Output -->
      <div class="output-area">
        <div id="output-email" class="generated-email"></div>
        <div id="status" class="status-msg">Ready.</div>
      </div>

    </div>

    <footer class="footer">
      by continuing, you agree to terms and ethics of use
    </footer>
  </main>

  <!-- Modals -->
  <div id="domain-modal" class="overlay" onclick="closeModal(event, 'domain-modal')">
    <div class="panel">
      <button class="panel-close" onclick="closeModal(event, 'domain-modal', true)">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
      <h3>Domains & Settings</h3>
      <ul id="domain-list" class="item-list"></ul>
      <div class="add-form">
        <input type="text" id="new-domain" placeholder="e.g. @gmail.com">
        <button onclick="addDomain()">Add</button>
      </div>
      
      <div class="danger-zone">
        <button class="btn-danger" onclick="resetSystem()">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          Global Reset Data
        </button>
      </div>
    </div>
  </div>

  <div id="history-modal" class="overlay" onclick="closeModal(event, 'history-modal')">
    <div class="panel" style="width: 600px;">
      <button class="panel-close" onclick="closeModal(event, 'history-modal', true)">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
      <h3>Generation History</h3>
      <ul id="history-list" class="item-list"></ul>
    </div>
  </div>

  <script>
    // --- Database Engine (Handles LocalStorage persistence) ---
    const DB_KEY = 'dotVariantGenDB';
    let appData = {
      domains: ['@gmail.com'],
      active_domain: '@gmail.com',
      history: [],
      used_patterns: {}
    };
    let lastGenerated = null;

    function initDB() {
      const stored = localStorage.getItem(DB_KEY);
      if (stored) {
        try { 
          const parsed = JSON.parse(stored);
          appData = { ...appData, ...parsed };
        } catch(e) { console.error("DB Parse error", e); }
      } else {
        saveDB(); // Save initial state
      }
      renderDomains();
      renderHistory();
    }

    function saveDB() {
      localStorage.setItem(DB_KEY, JSON.stringify(appData));
    }

    function saveToHistory(item) {
      item.created_at = new Date().toISOString();
      appData.history.unshift(item);
      if (appData.history.length > 100) appData.history.length = 100; // Keep a maximum of 100 history records
      saveDB();
    }

    // --- Frontend & UI Updates ---
    function renderDomains() {
      const select = document.getElementById('domain-select');
      const list = document.getElementById('domain-list');
      select.innerHTML = '';
      list.innerHTML = '';

      appData.domains.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = d;
        if (d === appData.active_domain) opt.selected = true;
        select.appendChild(opt);

        const li = document.createElement('li');
        li.innerHTML = `
          <span style="color: ${d === appData.active_domain ? '#fff' : '#888'}">
            ${d} ${d === appData.active_domain ? '(active)' : ''}
          </span>
          <div class="item-actions">
            ${d !== appData.active_domain ? `<button onclick="setActiveDomain('${d}')">Set Active</button>` : ''}
            <button class="btn-del" onclick="deleteDomain('${d}')">Del</button>
          </div>
        `;
        list.appendChild(li);
      });
    }

    function renderHistory() {
      const list = document.getElementById('history-list');
      list.innerHTML = '';
      if (appData.history.length === 0) {
        list.innerHTML = '<li><span style="color:#666">No history yet.</span></li>';
      }
      appData.history.forEach((item, index) => {
        const li = document.createElement('li');
        const date = new Date(item.created_at).toLocaleString();
        li.innerHTML = `
          <div>
            <div style="color: var(--accent); font-weight: bold;">${item.email}</div>
            <div style="font-size: 10px; color: #666;">${date} | Base: ${item.base_local}</div>
          </div>
          <div class="item-actions">
            <button onclick="copyText('${item.email}')">Copy</button>
            <button class="btn-del" onclick="deleteHistoryItem(${index})">Del</button>
          </div>
        `;
        list.appendChild(li);
      });
    }

    // --- Core Generation Logic ---
    function generate() {
      const input = document.getElementById('local-part').value.replace(/\./g, '').trim();
      const domain = document.getElementById('domain-select').value;
      const statusEl = document.getElementById('status');
      
      if (input.length < 2) {
        statusEl.textContent = 'Error: Local part must be at least 2 characters (excluding dots).';
        statusEl.style.color = '#ff5555';
        return;
      }
      if (!domain.includes('.') || domain.length < 3) {
        statusEl.textContent = 'Error: Invalid domain configuration.';
        statusEl.style.color = '#ff5555';
        return;
      }

      // Auto-save the previously generated email before generating a new one
      if (lastGenerated) saveToHistory(lastGenerated);

      const key = `${input}|${domain}`;
      if (!appData.used_patterns[key]) appData.used_patterns[key] = [];
      const used = appData.used_patterns[key];
      
      const n_spots = input.length - 1;
      
      // Prevent excessively long strings
      if (n_spots > 30) {
        statusEl.textContent = 'Error: Local part too long.';
        statusEl.style.color = '#ff5555';
        return;
      }

      const max_patterns = Math.pow(2, n_spots);
      if (used.length >= max_patterns) {
        statusEl.textContent = 'Error: No more unique dot patterns available for this combination.';
        statusEl.style.color = '#ff5555';
        return;
      }

      let chosen_str = null;
      if (max_patterns < 100000) {
        // Deterministic search for smaller combinations
        const available = [];
        for (let i = 0; i < max_patterns; i++) {
          const bin = i.toString(2).padStart(n_spots, '0');
          if (!used.includes(bin)) available.push(bin);
        }
        chosen_str = available[Math.floor(Math.random() * available.length)];
      } else {
        // Probabilistic search for larger combination spaces to maintain performance
        for (let i = 0; i < 10000; i++) {
          let candidate = '';
          for (let s = 0; s < n_spots; s++) candidate += Math.floor(Math.random() * 2);
          if (!used.includes(candidate)) {
            chosen_str = candidate;
            break;
          }
        }
        if (!chosen_str) {
          statusEl.textContent = 'Error: Failed to find a unique pattern rapidly.';
          statusEl.style.color = '#ff5555';
          return;
        }
      }

      // Mark pattern as used
      appData.used_patterns[key].push(chosen_str);
      saveDB();

      // Assemble the final email string
      let res_email = input[0];
      for (let i = 0; i < n_spots; i++) {
        if (chosen_str[i] === '1') res_email += '.';
        res_email += input[i + 1];
      }
      res_email += domain;

      // Update the UI
      document.getElementById('output-email').textContent = res_email;
      
      let msg = "Generated new unique pattern.";
      if (lastGenerated) msg = "Auto-saved previous email. " + msg;
      statusEl.textContent = msg;
      statusEl.style.color = '#AAAAAA';

      if (appData.active_domain !== domain) setActiveDomain(domain, false); 
      
      lastGenerated = {
        email: res_email,
        base_local: input,
        domain: domain,
        pattern: chosen_str
      };

      renderHistory();
    }

    // Capture the very last generation if user closes tab
    window.addEventListener('beforeunload', () => {
      if (lastGenerated) saveToHistory(lastGenerated);
    });

    // --- History & Data Management ---
    function deleteHistoryItem(index) {
      appData.history.splice(index, 1);
      saveDB();
      renderHistory();
    }

    function resetSystem() {
      if (confirm("Are you sure? This will permanently delete all domains, history, and generated patterns.")) {
        localStorage.removeItem(DB_KEY);
        location.reload();
      }
    }

    function addDomain() {
      let val = document.getElementById('new-domain').value.trim();
      if (!val) return;
      if (!val.startsWith('@')) val = '@' + val;
      if (!val.includes('.')) { alert("Domain must contain a dot."); return; }
      
      if (!appData.domains.includes(val)) {
        appData.domains.push(val);
        if (appData.domains.length === 1) appData.active_domain = val;
        saveDB();
      }
      document.getElementById('new-domain').value = '';
      renderDomains();
    }

    function deleteDomain(d) {
      if (!confirm(`Delete ${d}?`)) return;
      appData.domains = appData.domains.filter(domain => domain !== d);
      if (appData.active_domain === d) {
        appData.active_domain = appData.domains[0] || '';
      }
      saveDB();
      renderDomains();
    }

    function setActiveDomain(d, reload = true) {
      if (appData.domains.includes(d)) {
        appData.active_domain = d;
        saveDB();
      }
      if (reload) renderDomains();
    }

    function copyResult() {
      const txt = document.getElementById('output-email').textContent;
      if (txt) copyText(txt, true);
    }

    function copyText(txt, isMain = false) {
      navigator.clipboard.writeText(txt).then(() => {
        if (isMain) {
          const st = document.getElementById('status');
          st.textContent = "Copied to clipboard!";
          st.style.color = '#f89e24';
        } else {
          alert('Copied: ' + txt);
        }
      });
    }

    function handleEnter(e) {
      if (e.key === 'Enter') generate();
    }

    // Modal behavior
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(e, id, force = false) {
      if (force || e.target.id === id) {
        document.getElementById(id).style.display = 'none';
      }
    }

    // App Initialization
    window.onload = initDB;
  </script>
</body>
</html>
